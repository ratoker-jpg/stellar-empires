name: Fix release badge once

on:
  push:
    branches:
      - agent/release-packaging-metadata

permissions:
  contents: write

jobs:
  fix-badge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-packaging-metadata
      - name: Remove static legacy version fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<span class="build-badge" id="build-version">v0.1.0</span>'
          new = '<span class="build-badge" id="build-version">v—</span>'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one legacy build badge')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit badge fallback fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove legacy static build badge'
          git push origin HEAD:agent/release-packaging-metadata
