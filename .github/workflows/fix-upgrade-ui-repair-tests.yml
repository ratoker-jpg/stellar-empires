name: Fix upgrade UI and repair tests

on:
  push:
    paths:
      - '.github/workflows/fix-upgrade-ui-repair-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/fix-upgrade-ui-repair-tests.py
      - name: Remove temporary patch files
        run: rm scripts/fix-upgrade-ui-repair-tests.py .github/workflows/fix-upgrade-ui-repair-tests.yml
      - name: Commit corrected upgrade callsites
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire upgrade UI and repair tests to profiles'
          git push origin HEAD:agent/progression-profile-foundation
