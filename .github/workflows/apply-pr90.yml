name: Apply PR90 payload

on:
  push:
    branches:
      - agent/pr90-complete-building-economy
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/pr90-complete-building-economy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr90-complete-building-economy
      - name: Apply verified local payload
        shell: bash
        run: |
          cat .github/payload/pr90.part* | base64 -d > /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C .
          rm -rf .github/payload .github/workflows/apply-pr90.yml
          git config user.name 'stellar-empires-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete 24-building economy'
          git push origin HEAD:agent/pr90-complete-building-economy
