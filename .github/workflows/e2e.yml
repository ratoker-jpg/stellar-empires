name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  production-pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production Pages smoke
        run: npm run e2e:production
      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-report
          path: playwright-production-report
          retention-days: 7

  pr4-lockfile-refresh:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/post-1.0-low-cost-quality-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate axe dependency metadata
        run: npm install --package-lock-only --save-dev @axe-core/playwright@4.13.0 --no-audit --no-fund
      - name: Upload generated package metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr4-package-metadata
          path: |
            package.json
            package-lock.json
          retention-days: 1
