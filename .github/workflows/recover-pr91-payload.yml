name: Recover PR91 payload

on:
  push:
    branches:
      - agent/pr91-complete-technology-tree
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'agent/pr91-complete-technology-tree' || github.ref_name == 'agent/pr91-complete-technology-tree'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Diagnose archive
        shell: bash
        run: |
          set +e
          {
            echo 'PART SIZES'
            wc -c .github/payload/pr91.part*
            echo
            echo 'PART HASHES'
            sha256sum .github/payload/pr91.part*
            echo
            echo 'JOINED BASE64 HASH'
            cat .github/payload/pr91.part00 \
                .github/payload/pr91.part01 \
                .github/payload/pr91.part02 \
                .github/payload/pr91.part03 \
                .github/payload/pr91.part04 \
                .github/payload/pr91.part05 \
                .github/payload/pr91.part06 \
              | tee /tmp/pr91-payload.b64 \
              | sha256sum
            base64 -d /tmp/pr91-payload.b64 > /tmp/pr91-payload.tar.gz
            echo "BASE64_STATUS=$?"
            ls -l /tmp/pr91-payload.tar.gz
            sha256sum /tmp/pr91-payload.tar.gz
            gzip -t /tmp/pr91-payload.tar.gz
            echo "GZIP_STATUS=$?"
            tar -tzf /tmp/pr91-payload.tar.gz > /tmp/pr91-file-list.txt
            echo "TAR_STATUS=$?"
            cat /tmp/pr91-file-list.txt
          } > /tmp/pr91-diagnostics.txt 2>&1
          cat /tmp/pr91-diagnostics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr91-recovery-diagnostics
          path: |
            /tmp/pr91-payload.b64
            /tmp/pr91-payload.tar.gz
            /tmp/pr91-file-list.txt
            /tmp/pr91-diagnostics.txt
          retention-days: 1
