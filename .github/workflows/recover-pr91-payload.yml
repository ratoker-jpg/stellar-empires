name: Recover PR91 payload

on:
  push:
    branches:
      - agent/pr91-complete-technology-tree

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload/pr91.part00 \
              .github/payload/pr91.part01 \
              .github/payload/pr91.part02 \
              .github/payload/pr91.part03 \
              .github/payload/pr91.part04 \
              .github/payload/pr91.part05 \
              .github/payload/pr91.part06 \
            | base64 -d > /tmp/pr91-payload.tar.gz
          gzip -t /tmp/pr91-payload.tar.gz
          tar -tzf /tmp/pr91-payload.tar.gz > /tmp/pr91-file-list.txt
          sha256sum /tmp/pr91-payload.tar.gz > /tmp/pr91-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr91-recovered-payload
          path: |
            /tmp/pr91-payload.tar.gz
            /tmp/pr91-file-list.txt
            /tmp/pr91-sha256.txt
          retention-days: 1
