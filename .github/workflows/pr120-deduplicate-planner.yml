name: PR120 deduplicate planner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  deduplicate:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove duplicate scout helper block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/simulation/bots/fleetMissionPlanner.ts')
          text = path.read_text()
          block = """  const fullCurrentTargetIds = new Set(
            perception.foreignPlanets
              .filter((planet) => planet.freshness === 'current' && planet.snapshot.level === 3)
              .map((planet) => planet.planetId),
          );
          const scoutPriority = (targetId: string): number => {
            const intelligence = perception.foreignPlanets.find((planet) => planet.planetId === targetId);
            if (intelligence?.freshness === 'stale') return 0;
            if (intelligence !== undefined && intelligence.snapshot.level < 3) return 1;
            return 2;
          };
          """
          duplicate = block + "\n" + block
          if duplicate not in text:
              raise SystemExit('duplicate scout helper block not found')
          path.write_text(text.replace(duplicate, block, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation/bots/fleetMissionPlanner.ts
          git commit -m 'Deduplicate prioritized scout target selection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
