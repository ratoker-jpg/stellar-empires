name: PR120 deduplicate planner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  deduplicate:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove duplicate scout helper block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/simulation/bots/fleetMissionPlanner.ts')
          text = path.read_text()
          marker = "  const fullCurrentTargetIds = new Set("
          first = text.index(marker)
          second = text.index(marker, first + len(marker))
          scout_loop = text.index(
              "  for (const fleet of fleets.filter((candidate) => hasRole(candidate, 'scout'))) {",
              second,
          )
          path.write_text(text[:second] + text[scout_loop:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation/bots/fleetMissionPlanner.ts
          git commit -m 'Deduplicate prioritized scout target selection'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
