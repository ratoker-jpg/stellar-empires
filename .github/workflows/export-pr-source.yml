name: Export PR source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pack source snapshot
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='assets/source' -czf /tmp/stellar-empires-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-empires-source
          path: /tmp/stellar-empires-source.tgz
          if-no-files-found: error
          retention-days: 1
