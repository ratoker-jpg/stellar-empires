name: Generate playable roadmap v5

on:
  push:
    branches:
      - docs/playable-game-roadmap-v5

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/playable-game-roadmap-v5
      - name: Generate verified roadmap documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import shutil

          payload_dir = Path('.github/roadmap-v5-payload')
          parts = sorted(payload_dir.glob('part-*.txt'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 payload parts, found {len(parts)}')

          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          raw = gzip.decompress(base64.b64decode(payload))
          expected = 'a6f7db7b7ae7d34571df9c9afa92f6ee2341a71906e4e0a4dac835f798f46ab0'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'checksum mismatch: {actual}')

          documents = json.loads(raw.decode('utf-8'))
          expected_paths = {
              'docs/27-playable-game-roadmap-v5.md',
              'docs/asset-prompts/master-runtime-asset-backlog.md',
              'docs/handoffs/2026-07-26-playable-roadmap-handoff.md',
          }
          if set(documents) != expected_paths:
              raise SystemExit(f'unexpected document paths: {sorted(documents)}')

          for path, content in documents.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          shutil.rmtree(payload_dir)
          Path('.github/workflows/generate-playable-roadmap-v5.yml').unlink()
          PY
      - name: Commit generated roadmap documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add the playable-game roadmap and asset backlog'
          git push origin HEAD:docs/playable-game-roadmap-v5
