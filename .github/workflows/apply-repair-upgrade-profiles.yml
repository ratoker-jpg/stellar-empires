name: Apply repair and upgrade profiles

on:
  push:
    paths:
      - '.github/workflows/apply-repair-upgrade-profiles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/apply-repair-upgrade-profiles.py
      - name: Remove temporary patch files
        run: rm scripts/apply-repair-upgrade-profiles.py .github/workflows/apply-repair-upgrade-profiles.yml
      - name: Commit repair and upgrade profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply progression profiles to repair and upgrades'
          git push origin HEAD:agent/progression-profile-foundation
