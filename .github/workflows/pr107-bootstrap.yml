name: PR107 Universe asset bootstrap

on:
  push:
    branches:
      - feat/107-universe-asset-pipeline
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/107-universe-asset-pipeline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and run bootstrap
        shell: bash
        run: |
          cat .github/bootstrap/pr107/part-* | base64 --decode | gzip --decompress > scripts/assets/bootstrap-universe-pipeline.mjs
          node scripts/assets/bootstrap-universe-pipeline.mjs

      - name: Generate runtime assets
        run: npm run assets:process

      - name: Generate Universe contact sheets
        run: npm run assets:contact-sheet

      - name: Regenerate asset audit
        run: npm run assets:audit

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee docs/changes/pr107-lint-diagnostics.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Typecheck
        if: steps.lint.outcome == 'success'
        run: npm run typecheck

      - name: Test
        if: steps.lint.outcome == 'success'
        run: npm run test

      - name: Build
        if: steps.lint.outcome == 'success'
        run: npm run build

      - name: Commit generated implementation and diagnostics
        if: always() && steps.lint.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Universe runtime asset pipeline"
          git push origin HEAD:feat/107-universe-asset-pipeline

      - name: Fail on lint diagnostics
        if: steps.lint.outcome == 'failure'
        run: exit 1
