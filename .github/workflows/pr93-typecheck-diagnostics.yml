name: PR93 test diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'agent/pr93-complete-ship-rosters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - run: npm install --no-audit --no-fund
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm run test > /tmp/test.log 2>&1
          status=$?
          cat /tmp/test.log
          echo "TEST_STATUS=$status" >> /tmp/test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr93-test-log
          path: /tmp/test.log
          retention-days: 1
