name: Finalize PR105 merge metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-pr105-main
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'stellar-empires-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - name: Finalize exact merge metadata
        run: node scripts/automation/finalize-pr105.mjs
      - name: Commit finalized state
        run: |
          git config user.name "stellar-empires-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize asset runtime integration batch metadata"
          git push origin HEAD:main
