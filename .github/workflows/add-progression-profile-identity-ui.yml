name: Add progression profile identity UI

on:
  push:
    paths:
      - '.github/workflows/add-progression-profile-identity-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/add-progression-profile-identity-ui.py
      - name: Remove temporary patch files
        run: rm scripts/add-progression-profile-identity-ui.py .github/workflows/add-progression-profile-identity-ui.yml
      - name: Commit profile identity UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose progression profile identity in campaign UI'
          git push origin HEAD:agent/progression-profile-foundation
