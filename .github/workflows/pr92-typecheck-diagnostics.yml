name: PR92 typecheck diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'agent/pr91-complete-technology-tree-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - run: npm install --no-audit --no-fund
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          echo "TYPECHECK_STATUS=$status" >> /tmp/typecheck.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr92-typecheck-log
          path: /tmp/typecheck.log
          retention-days: 1
