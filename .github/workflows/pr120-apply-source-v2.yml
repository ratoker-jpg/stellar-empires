name: PR120 apply source v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-source:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply embedded source patch
        shell: bash
        run: |
          sed -n '25p' .github/workflows/pr120-apply-source.yml | tr -d ' ' > /tmp/pr120.patch.gz.b64
          base64 -d /tmp/pr120.patch.gz.b64 | gzip -d > /tmp/pr120.patch
          sed -i 's#pr120base/#a/#g; s#pr120/#b/#g' /tmp/pr120.patch
          git apply /tmp/pr120.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Implement mission intelligence bot gate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
