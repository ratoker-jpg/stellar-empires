name: PR117 test diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  capture-vitest-output:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture full test output
        shell: bash
        run: |
          set +e
          npm run test > pr117-vitest-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> pr117-vitest-output.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr117-vitest-output
          path: pr117-vitest-output.txt
          if-no-files-found: error
