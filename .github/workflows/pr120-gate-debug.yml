name: PR120 gate diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  capture:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instrument gate and capture output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/testing/e2eRuntime.ts')
          text = path.read_text()
          text = text.replace(
            "import type { MissionAvailabilityCode } from '../simulation/fleets/missionRules';",
            "import { getMissionAvailability, type MissionAvailabilityCode } from '../simulation/fleets/missionRules';",
          )
          old = "    throw new Error(`Expected attack plan, received ${attackPlan.reasonCode}.`);"
          new = """    const strike = state.fleets.find((fleet) => fleet.id === BOT_GATE_STRIKE_FLEET_ID);\n    const target = state.planets.find((planet) => planet.ownerEmpireId === 'player');\n    const direct = strike === undefined || target === undefined ? null : getMissionAvailability(state, { type: 'SEND_FLEET', empireId: BOT_GATE_EMPIRE_ID, fleetId: strike.id, targetPlanetId: target.id, mission: 'attack' });\n    throw new Error(JSON.stringify({ attackPlan, direct, fleets: state.fleets, observations: getEmpireIntelligence(state.intelligence, BOT_GATE_EMPIRE_ID)?.observations }));"""
          if old not in text:
            raise SystemExit('gate throw target missing')
          path.write_text(text.replace(old, new))
          PY
          set +e
          npx vitest run tests/integration/ordinaryMissionIntelligenceLoop.test.ts --reporter=verbose > /tmp/pr120-gate-debug.txt 2>&1
          echo exit_code=$? >> /tmp/pr120-gate-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr120-gate-debug
          path: /tmp/pr120-gate-debug.txt
