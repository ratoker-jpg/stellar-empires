name: PR107 Universe safe-area regeneration

on:
  push:
    branches:
      - feat/107-universe-asset-pipeline

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/107-universe-asset-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch generated-runtime classification
        run: node scripts/assets/pr107-fix-classification.mjs
      - name: Regenerate all deterministic asset outputs
        run: |
          npm run assets:process
          npm run assets:contact-sheet
          npm run assets:audit
      - name: Validate repository
        run: |
          npm run assets:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Remove temporary regeneration files and commit
        shell: bash
        run: |
          rm .github/workflows/pr107-regenerate.yml
          rm scripts/assets/pr107-fix-classification.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce Universe runtime safe areas"
          git push origin HEAD:feat/107-universe-asset-pipeline
