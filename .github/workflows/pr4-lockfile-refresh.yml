name: PR4 lockfile refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'agent/post-1.0-low-cost-quality-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate exact axe dependency metadata
        run: npm install --package-lock-only --save-dev --save-exact @axe-core/playwright@4.13.0 --no-audit --no-fund

      - name: Commit generated package metadata if needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package metadata already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: add axe Playwright dependency"
          git push origin HEAD:${{ github.head_ref }}
