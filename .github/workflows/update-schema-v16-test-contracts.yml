name: Update schema v16 test contracts

on:
  push:
    paths:
      - '.github/workflows/update-schema-v16-test-contracts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/update-schema-v16-test-contracts.py
      - name: Remove temporary patch files
        run: rm scripts/update-schema-v16-test-contracts.py .github/workflows/update-schema-v16-test-contracts.yml
      - name: Commit schema v16 test contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update tests for schema v16 profiles'
          git push origin HEAD:agent/progression-profile-foundation
