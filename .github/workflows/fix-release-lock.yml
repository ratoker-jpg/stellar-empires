name: Fix release lock metadata

on:
  push:
    branches:
      - agent/release-1.0-closure
    paths:
      - .github/workflows/fix-release-lock.yml

permissions:
  contents: write

jobs:
  fix-release-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-1.0-closure
          fetch-depth: 0
      - name: Restore exact base lock and advance release version
        shell: bash
        run: |
          git checkout 1221bfe19cc11f836db7fe7e5720f778419c2dd9 -- package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '1.0.0';
          lock.packages[''].version = '1.0.0';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          rm .github/workflows/fix-release-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json .github/workflows/fix-release-lock.yml
          git diff --cached --check
          git commit -m 'Normalize release lock metadata'
          git push origin HEAD:agent/release-1.0-closure
