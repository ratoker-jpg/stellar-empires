name: Wire economy progression profile

on:
  push:
    paths:
      - '.github/workflows/wire-economy-progression-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/compressed-campaign-progression-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/wire-economy-progression-profile.py
      - name: Remove temporary patch files
        run: rm scripts/wire-economy-progression-profile.py .github/workflows/wire-economy-progression-profile.yml
      - name: Commit economy profile callsites
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire campaign profile through economy runtime'
          git push origin HEAD:agent/compressed-campaign-progression-gate
