name: PR120 source export

on:
  pull_request:
    branches: [main]

jobs:
  export-source:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: pr120-source
          path: |
            .
            !node_modules
            !dist
          include-hidden-files: true
          if-no-files-found: error
