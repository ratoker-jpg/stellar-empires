name: Capture final PR99 validation

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Apply closed legacy allowlist
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config_path = Path('assets/manifests/asset-pipeline.config.json')
          config = json.loads(config_path.read_text())
          config['legacyDirectSourceReferences'] = [
              'src/assets/galaxyFleetRuntimeAssets.ts',
              'src/assets/generatedFactionIdentityAssets.ts',
              'src/assets/planetIndustryRuntimeAssets.ts',
          ]
          config_path.write_text(json.dumps(config, indent=2) + '\n')
          check_path = Path('scripts/assets/check.mjs')
          content = check_path.read_text()
          old = "const provenanceMetadataAllowlist = new Set(['src/assets/completeMechanicalAssetManifest.ts']);"
          new = "const provenanceMetadataAllowlist = new Set([\n  'src/assets/completeMechanicalAssetManifest.ts',\n  ...config.legacyDirectSourceReferences,\n]);"
          if old in content:
              check_path.write_text(content.replace(old, new))
          PY

      - run: npm install --no-audit --no-fund
      - run: npm run assets:audit

      - name: Capture validation
        shell: bash
        run: |
          set +e
          npm run check > .agent/pr99-final-validation.txt 2>&1
          code=$?
          echo "exit-code=$code" >> .agent/pr99-final-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manifests/asset-pipeline.config.json scripts/assets/check.mjs assets/manifests/source-asset-audit.json docs/assets/generated-asset-audit.md package-lock.json .agent/pr99-final-validation.txt
          git commit -m "Record final PR99 validation"
          git push origin HEAD:agent/pr99-asset-processing-foundation
