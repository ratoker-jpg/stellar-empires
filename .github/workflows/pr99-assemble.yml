name: Finalize PR99

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regenerate committed audit
        run: npm run assets:audit

      - name: Run full quality gate
        run: npm run check

      - name: Remove diagnostics and commit final diff
        shell: bash
        run: |
          rm -rf .agent
          rm -f .github/workflows/pr99-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize PR99 asset processing foundation"
          git push origin HEAD:agent/pr99-asset-processing-foundation
