name: Finalize PR99 asset pipeline

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Register the closed legacy source-reference allowlist
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('assets/manifests/asset-pipeline.config.json')
          config = json.loads(config_path.read_text())
          config['legacyDirectSourceReferences'] = [
              'src/assets/galaxyFleetRuntimeAssets.ts',
              'src/assets/generatedFactionIdentityAssets.ts',
              'src/assets/planetIndustryRuntimeAssets.ts',
          ]
          config_path.write_text(json.dumps(config, indent=2) + '\n')

          check_path = Path('scripts/assets/check.mjs')
          content = check_path.read_text()
          old = "const provenanceMetadataAllowlist = new Set(['src/assets/completeMechanicalAssetManifest.ts']);"
          new = "const provenanceMetadataAllowlist = new Set([\n  'src/assets/completeMechanicalAssetManifest.ts',\n  ...config.legacyDirectSourceReferences,\n]);"
          if old not in content:
              raise SystemExit('source-reference allowlist block not found')
          check_path.write_text(content.replace(old, new))
          PY

      - run: npm install --no-audit --no-fund
      - run: npm run assets:audit
      - run: npm run check

      - name: Commit final reviewable diff
        shell: bash
        run: |
          rm -f .agent/pr99-payload.b64 .agent/pr99-trigger .agent/pr99-diagnostic.txt .agent/pr99-audit-error.txt .agent/pr99-validation-error.txt
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/pr99-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize the deterministic asset pipeline"
          git push origin HEAD:agent/pr99-asset-processing-foundation
