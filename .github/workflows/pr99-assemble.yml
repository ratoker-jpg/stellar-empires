name: Diagnose PR99 asset audit

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - run: npm install --no-audit --no-fund

      - name: Capture audit output
        shell: bash
        run: |
          set +e
          npm run assets:audit > .agent/pr99-audit-error.txt 2>&1
          code=$?
          echo "exit-code=$code" >> .agent/pr99-audit-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/pr99-audit-error.txt
          git commit -m "Record PR99 audit diagnostics"
          git push origin HEAD:agent/pr99-asset-processing-foundation
