name: Assemble PR99 asset pipeline

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - name: Record payload diagnostics
        shell: bash
        run: |
          python - <<'PY' > .agent/pr99-diagnostic.txt 2>&1
          import base64, hashlib, pathlib, traceback
          path = pathlib.Path('.agent/pr99-payload.b64')
          source = path.read_bytes()
          print(f'raw-bytes={len(source)}')
          print(f'stripped-bytes={len(source.strip())}')
          print(f'prefix={source[:32]!r}')
          print(f'suffix={source[-32:]!r}')
          try:
              payload = base64.b64decode(source.strip(), validate=True)
              print(f'payload-bytes={len(payload)}')
              print(f'payload-sha256={hashlib.sha256(payload).hexdigest()}')
              print(f'gzip-prefix={payload[:8].hex()}')
          except Exception:
              traceback.print_exc()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/pr99-diagnostic.txt
          git commit -m "Record PR99 payload diagnostics"
          git push origin HEAD:agent/pr99-asset-processing-foundation
