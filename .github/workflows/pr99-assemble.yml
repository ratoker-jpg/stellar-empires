name: Finalize PR99 asset pipeline

on:
  push:
    branches:
      - agent/pr99-asset-processing-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr99-asset-processing-foundation
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate committed asset audit
        run: npm run assets:audit

      - name: Validate implementation
        run: npm run check

      - name: Commit final reviewable diff
        shell: bash
        run: |
          rm -f .agent/pr99-payload.b64 .agent/pr99-trigger .agent/pr99-diagnostic.txt
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/pr99-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate the repository asset audit"
          git push origin HEAD:agent/pr99-asset-processing-foundation
