name: PR118 test diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  capture-test-output:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture full test output
        shell: bash
        run: |
          set +e
          npm run test > pr118-test-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> pr118-test-output.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr118-test-output
          path: pr118-test-output.txt
          if-no-files-found: error
