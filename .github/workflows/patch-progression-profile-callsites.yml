name: Patch progression profile callsites

on:
  push:
    paths:
      - '.github/workflows/patch-progression-profile-callsites.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded replacements
        run: python scripts/patch-progression-profile-callsites.py
      - name: Remove temporary patch files
        run: rm scripts/patch-progression-profile-callsites.py .github/workflows/patch-progression-profile-callsites.yml
      - name: Commit patched callsites
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Wire progression profiles through UI and tests'
          git push origin HEAD:agent/progression-profile-foundation
