name: Generate Nemexia navigation documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/nemexia-final-complete-mechanics-reference' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/nemexia-final-complete-mechanics-reference
      - name: Generate verified navigation reference
        shell: bash
        run: |
          python - <<'PYDOC'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import shutil

          payload_dir = Path('.github/nemexia-nav-payload')
          parts = sorted(payload_dir.glob('part-*.txt'))
          if len(parts) != 2:
              raise SystemExit(f'expected 2 payload parts, found {len(parts)}')

          payload = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          content = gzip.decompress(base64.b64decode(payload))
          expected = '055cc93ef1aa7aa06061284dc404f58f8ebea703cf2872f8adddf4500908be0c'
          actual = hashlib.sha256(content).hexdigest()
          if actual != expected:
              raise SystemExit(f'checksum mismatch: {actual}')

          target = Path('docs/research/nemexia-navigation-and-ui-reference-2026-07-26.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(content)

          shutil.rmtree(payload_dir)
          Path('.github/workflows/nemexia-nav-doc-generator.yml').unlink()
          PYDOC
      - name: Commit generated navigation documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document Nemexia navigation and UI structure'
          git push origin HEAD:agent/nemexia-final-complete-mechanics-reference
