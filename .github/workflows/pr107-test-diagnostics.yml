name: PR107 test diagnostics

on:
  push:
    branches:
      - feat/107-universe-asset-pipeline

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/107-universe-asset-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm run test > docs/changes/pr107-test-diagnostics.txt 2>&1
          status=$?
          printf '\nTEST_EXIT_STATUS=%s\n' "$status" >> docs/changes/pr107-test-diagnostics.txt
          rm .github/workflows/pr107-test-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record PR107 test diagnostics"
          git push origin HEAD:feat/107-universe-asset-pipeline
