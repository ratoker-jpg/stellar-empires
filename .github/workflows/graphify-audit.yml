name: Graphify audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/graphify-audit.yml'
      - 'scripts/graphify-audit.sh'
      - '.graphify-version'
      - 'docs/28-audit-first-autonomous-delivery-protocol.md'
      - 'docs/audits/**'
      - 'AGENTS.md'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: graphify-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Graphify and build code graph
        id: graphify
        env:
          GRAPHIFY_VERSION: '0.8.38'
          PYTHON_BIN: python
        shell: bash
        run: |
          set +e
          bash scripts/graphify-audit.sh code > graphify-ci.log 2>&1
          code=$?
          echo "exit-code=$code" >> graphify-ci.log
          cat graphify-ci.log
          exit "$code"

      - name: Validate generated outputs
        run: |
          test -s .agents/skills/graphify/SKILL.md
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md

      - name: Upload Graphify outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: graphify-audit-output
          path: |
            graphify-ci.log
            .agents/skills/graphify/
            graphify-out/
          if-no-files-found: warn
          retention-days: 14
