name: PR120 test diagnostics

on:
  pull_request:
    branches: [main]

jobs:
  capture:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test -- --run --reporter=verbose > /tmp/pr120-tests.txt 2>&1
          echo exit_code=$? >> /tmp/pr120-tests.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr120-tests
          path: /tmp/pr120-tests.txt
