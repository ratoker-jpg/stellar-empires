name: PR119 compatibility autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-report-labels:
    if: github.head_ref == 'agent/intelligence-reports-presentation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch extensible report labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('src/ui/missionReportsPanel.ts'): (
                  '  kind.textContent = KIND_LABELS[report.kind];',
                  '  kind.textContent = KIND_LABELS[report.kind] ?? report.kind;',
              ),
              Path('src/ui/reportsWorkspace.ts'): (
                  '  for (const label of [KIND_LABELS[report.kind], MODE_LABELS[report.mode], report.outcome]) {',
                  '  for (const label of [KIND_LABELS[report.kind] ?? report.kind, MODE_LABELS[report.mode], report.outcome]) {',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/missionReportsPanel.ts src/ui/reportsWorkspace.ts
          git commit -m 'Handle extensible intelligence report labels'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
