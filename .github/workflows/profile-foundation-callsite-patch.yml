name: Progression profile call-site patch

on:
  push:
    branches:
      - agent/progression-profile-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/progression-profile-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply exact replacements
        run: node scripts/profile-foundation-callsite-patch.mjs
      - name: Remove temporary patch runner
        run: rm scripts/profile-foundation-callsite-patch.mjs .github/workflows/profile-foundation-callsite-patch.yml
      - name: Commit patched call sites
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Wire progression profile through runtime and UI"
          git push origin HEAD:agent/progression-profile-foundation
