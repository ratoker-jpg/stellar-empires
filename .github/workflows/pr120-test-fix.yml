name: PR120 test fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply deterministic fixture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/testing/e2eRuntime.ts')
          text = path.read_text()
          old = '    ships: { [roles.ships.fighter]: 20 },'
          new = '    ships: { [roles.ships.fighter]: 5 },'
          if old not in text:
              raise SystemExit('strike fixture target missing')
          path.write_text(text.replace(old, new))

          path = Path('tests/simulation/botFleetMissionPlanner.test.ts')
          text = path.read_text()
          old = """    planets: state.planets.map((planet) =>
      planet.id === origin.id
        ? { ...planet, inventory: { ships: {}, defenses: {} } }
        : planet,
    ),"""
          new = """    planets: state.planets
      .filter((planet) => planet.id === origin.id || planet.id === target.id)
      .map((planet) =>
        planet.id === origin.id
          ? { ...planet, inventory: { ships: {}, defenses: {} } }
          : planet,
      ),"""
          if old not in text:
              raise SystemExit('cooldown fixture target missing')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/testing/e2eRuntime.ts tests/simulation/botFleetMissionPlanner.test.ts
          git commit -m 'Fix deterministic bot gate fixtures'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
