name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-pr107:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/107-universe-asset-pipeline'
    name: Generate PR107 implementation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/107-universe-asset-pipeline
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply audited implementation
        run: |
          node scripts/automation/implement-pr107.mjs
          node scripts/automation/patch-pr107-audit.mjs

      - name: Generate runtime assets
        run: npm run assets:process

      - name: Refresh asset audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node --trace-uncaught scripts/assets/audit.mjs 2>&1 | tee /tmp/pr107-audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '### PR107 asset-audit diagnostics'
              echo '```text'
              tail -n 180 /tmp/pr107-audit.log
              echo '```'
            } > /tmp/pr107-audit-comment.md
            gh pr comment 107 --body-file /tmp/pr107-audit-comment.md || true
            exit "$status"
          fi

      - name: Generate light and dark QA sheets
        run: node scripts/assets/contact-sheet.mjs

      - name: Remove temporary bootstrap files
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/automation/implement-pr107.mjs scripts/automation/patch-pr107-audit.mjs

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit generated implementation
        run: |
          git config user.name "stellar-empires-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement Universe asset pipeline"
          git push origin HEAD:feat/107-universe-asset-pipeline

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/107-universe-asset-pipeline'
    name: Asset audit, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
