name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Asset audit, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          echo "lint_status=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: lint-diagnostics
          path: lint-output.txt

      - name: Fail on lint errors
        if: env.lint_status != '0'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
