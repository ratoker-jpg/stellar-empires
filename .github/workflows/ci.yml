name: CI

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr110-e2e-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-pr110-e2e:
    if: github.head_ref == 'feat/110-universe-actions-gate'
    name: Diagnose PR110 browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/110-universe-actions-gate
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --save-dev @playwright/test --no-audit --no-fund
          npm pkg set scripts.e2e="playwright test"
      - name: Apply implementation
        run: |
          python3 scripts/automation/implement-pr110.py
          python3 scripts/automation/patch-pr110-typecheck.py
          python3 scripts/automation/patch-pr110-tests.py
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run and persist E2E diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run e2e 2>&1 | tee /tmp/pr110-e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/audits/evidence
            {
              echo "PR110 browser E2E failure"
              echo
              tail -n 1200 /tmp/pr110-e2e.log
              echo
              echo "=== test-results files ==="
              find test-results -maxdepth 4 -type f -print 2>/dev/null || true
              echo
              echo "=== Playwright error contexts ==="
              find test-results -name error-context.md -print -exec cat {} \; 2>/dev/null || true
            } > docs/audits/evidence/pr110-e2e-failure.txt
            git config user.name "stellar-empires-automation"
            git config user.email "actions@users.noreply.github.com"
            git add docs/audits/evidence/pr110-e2e-failure.txt
            git commit -m "Record PR110 browser E2E diagnostics"
            git push origin HEAD:feat/110-universe-actions-gate
            gh pr comment 110 --body "PR110 browser diagnostics were persisted to docs/audits/evidence/pr110-e2e-failure.txt." || true
            exit "$status"
          fi
