name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-pr108:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/108-universe-spatial-model'
    name: Generate PR108 implementation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/108-universe-spatial-model
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply audited implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/automation/implement-pr108.py 2>&1 | tee /tmp/pr108-bootstrap.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 bootstrap diagnostics'; echo '```text'; tail -n 240 /tmp/pr108-bootstrap.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Remove temporary bootstrap and evidence
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/automation/implement-pr108.py
          rm -f docs/audits/evidence/pr108-runtime-map.txt

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/pr108-lint.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 lint diagnostics'; echo '```text'; tail -n 260 /tmp/pr108-lint.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Typecheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/pr108-typecheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 typecheck diagnostics'; echo '```text'; tail -n 300 /tmp/pr108-typecheck.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run test 2>&1 | tee /tmp/pr108-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 test diagnostics'; echo '```text'; tail -n 360 /tmp/pr108-test.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/pr108-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 build diagnostics'; echo '```text'; tail -n 260 /tmp/pr108-build.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Run Graphify audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/graphify-audit.sh code 2>&1 | tee /tmp/pr108-graphify.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### PR108 Graphify diagnostics'; echo '```text'; tail -n 220 /tmp/pr108-graphify.log; echo '```'; } > /tmp/pr108-comment.md
            gh pr comment 108 --body-file /tmp/pr108-comment.md || true
            exit "$status"
          fi

      - name: Commit generated implementation
        run: |
          git config user.name "stellar-empires-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement Universe spatial model"
          git push origin HEAD:feat/108-universe-spatial-model

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/108-universe-spatial-model'
    name: Asset audit, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
