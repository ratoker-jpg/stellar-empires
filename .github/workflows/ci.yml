name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Asset audit, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate asset pipeline
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --exclude tests/simulation/campaignTimePerformance.test.ts

      - name: Build
        run: npm run build

  campaign-performance:
    name: Campaign catch-up performance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run isolated catch-up performance gate
        run: node --expose-gc ./node_modules/vitest/vitest.mjs run tests/simulation/campaignTimePerformance.test.ts --maxWorkers=1 --no-file-parallelism

  progression-scenario:
    name: Compressed progression scenario
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic progression scenario
        env:
          RUN_PROGRESSION_SCENARIO: '1'
        run: npx vitest run tests/audit/progressionScenarioExperiment.test.ts --maxWorkers=1 --no-file-parallelism

  organic-terminal:
    name: Organic Fresh Game to terminal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run organic terminal acceptance
        env:
          RUN_ORGANIC_TERMINAL_SCENARIO: '1'
        run: npx vitest run tests/audit/organicLateGameClosure.test.ts --maxWorkers=1 --no-file-parallelism
