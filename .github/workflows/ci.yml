name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-pr110-details:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/110-universe-actions-gate'
    name: Build PR110 focused action map
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/110-universe-actions-gate
          fetch-depth: 1
      - name: Extract focused action files
        run: bash scripts/automation/inspect-pr110-details.sh
      - name: Remove temporary inspector
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/automation/inspect-pr110-details.sh
          rm -f docs/audits/evidence/pr110-actions-map.txt
      - name: Commit focused map
        run: |
          git config user.name "stellar-empires-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record PR110 focused action map"
          git push origin HEAD:feat/110-universe-actions-gate

  quality:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/110-universe-actions-gate'
    name: Asset audit, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate asset pipeline
        run: npm run assets:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
