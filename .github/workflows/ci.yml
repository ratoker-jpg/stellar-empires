name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply verified PR90 payload
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/pr90-complete-building-economy'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payload/pr90.part* | base64 -d > /tmp/pr90-payload.tar.gz
          tar -xzf /tmp/pr90-payload.tar.gz -C .
          rm -rf .github/payload .github/workflows/apply-pr90.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit verified PR90 implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/pr90-complete-building-economy'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist package-lock.json
          git config user.name 'stellar-empires-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete 24-building economy'
          git push origin HEAD:${GITHUB_HEAD_REF}
