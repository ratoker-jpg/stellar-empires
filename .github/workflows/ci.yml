name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-pr90-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr90-complete-building-economy
      - name: Diagnose payload
        shell: bash
        run: |
          set +e
          {
            echo 'FILES'
            wc -c .github/payload/pr90.part*
            echo 'PART HASHES'
            sha256sum .github/payload/pr90.part*
            echo 'JOINED HASH'
            cat .github/payload/pr90.part* | sha256sum
            cat .github/payload/pr90.part* | base64 -d > /tmp/pr90-payload.tar.gz
            echo "BASE64_STATUS=$?"
            sha256sum /tmp/pr90-payload.tar.gz
            gzip -t /tmp/pr90-payload.tar.gz
            echo "GZIP_STATUS=$?"
            tar -tzf /tmp/pr90-payload.tar.gz >/tmp/pr90-tar-list.txt
            echo "TAR_STATUS=$?"
            cat /tmp/pr90-tar-list.txt
          } > /tmp/pr90-diagnostics.txt 2>&1
          cat /tmp/pr90-diagnostics.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr90-payload-diagnostics
          path: /tmp/pr90-diagnostics.txt
          retention-days: 1
