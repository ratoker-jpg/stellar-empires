name: PR120 planner fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Prioritize one honest scout target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          new = base64.b64decode('').decode()
          path = Path('src/simulation/bots/fleetMissionPlanner.ts')
          text = path.read_text()
          start = text.index("  for (const fleet of fleets.filter((candidate) => hasRole(candidate, 'scout'))) {")
          end = text.index("\n\n  for (const fleet of fleets.filter(isArmed)) {", start)
          path.write_text(text[:start] + new + text[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/simulation/bots/fleetMissionPlanner.ts
          git commit -m 'Prioritize honest scout targets before attack'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
