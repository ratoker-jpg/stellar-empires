name: PR102 bootstrap

on:
  push:
    branches:
      - feat/102-building-runtime-assets

permissions:
  contents: write

env:
  CI: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
      - run: npm install --no-audit --no-fund
      - name: Apply implementation
        run: node scripts/automation/implement-pr102.mjs
      - name: Generate runtime assets
        run: npm run assets:process
      - name: Refresh audit
        run: npm run assets:audit
      - name: Generate QA sheets
        run: node scripts/assets/contact-sheet.mjs
      - name: Validate complete change
        run: npm run check
      - name: Commit implementation
        run: |
          git config user.name "stellar-empires-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate complete building runtime assets"
          git push origin HEAD:feat/102-building-runtime-assets
