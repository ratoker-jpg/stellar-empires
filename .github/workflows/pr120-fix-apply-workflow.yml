name: PR120 fix apply workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-workflow:
    if: github.head_ref == 'agent/mission-intelligence-bot-gate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Indent embedded patch payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr120-apply-source.yml')
          lines = path.read_text().splitlines()
          path.write_text('\n'.join(('          ' + line if line.startswith('H4s') else line) for line in lines) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr120-apply-source.yml
          git commit -m 'Fix temporary source apply workflow'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
